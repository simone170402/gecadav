<section class="pt-32 pb-20 bg-gray-50 px-10 md:px-20 font-['Poppins']">
  <div class="max-w-5xl mx-auto text-center">
    <h2 class="text-[#bfa14a] text-3xl font-semibold mb-6 uppercase">Contact Us</h2>
    <p class="text-gray-700 mb-10">
      We’d love to hear from you. Reach out for inquiries or appointments.
    </p>

    <div class="grid md:grid-cols-2 gap-10 text-left">
      <!-- FORMULAIRE -->
      <div>
        <form class="space-y-4" (ngSubmit)="sendMessage()">

          <input
            type="text"
            placeholder="Full Name"
            required
            name="name"
            [(ngModel)]="formData.name"
            class="w-full border border-gray-300 p-3 rounded-md focus:ring-2 focus:ring-[#bfa14a]"
          />

          <input
            type="email"
            placeholder="Email Address"
            required
            name="email"
            [(ngModel)]="formData.email"
            class="w-full border border-gray-300 p-3 rounded-md focus:ring-2 focus:ring-[#bfa14a]"
          />

          <!-- OBJET -->
          <label for="subject" class="sr-only">Subject</label>
          <select
            id="subject"
            name="subject"
            required
            [(ngModel)]="formData.subject"
            aria-label="Subject"
            class="w-full border border-gray-300 p-3 rounded-md focus:ring-2 focus:ring-[#bfa14a]"
          >
            <option value="" disabled>Select Subject</option>
            <option value="Legal consultation">Legal consultation</option>
            <option value="Appointment request">Appointment request</option>
            <option value="Partnership">Partnership</option>
            <option value="Recruitment">Recruitment</option>
            <option value="other">Other</option>
          </select>


          <!-- OBJET PERSONNALISÉ -->
          <input
            *ngIf="formData.subject === 'other'"
            type="text"
            placeholder="Enter your subject"
            name="customSubject"
            [(ngModel)]="formData.customSubject"
            class="w-full border border-gray-300 p-3 rounded-md focus:ring-2 focus:ring-[#bfa14a]"
          />

          <textarea
            rows="5"
            placeholder="Your Message"
            required
            name="message"
            [(ngModel)]="formData.message"
            class="w-full border border-gray-300 p-3 rounded-md focus:ring-2 focus:ring-[#bfa14a]"
          ></textarea>

          <button
            type="submit"
            [disabled]="isSending"
            class="bg-gradient-to-r from-[#bfa14a] to-[#2a2a2a] text-white px-6 py-3 rounded-md hover:scale-105 transition disabled:opacity-50"
          >
            {{ isSending ? 'Sending...' : 'Send Message' }}
          </button>

          <p *ngIf="successMsg" class="text-green-600 font-semibold">
            {{ successMsg }}
          </p>

          <p *ngIf="errorMsg" class="text-red-600 font-semibold">
            {{ errorMsg }}
          </p>

        </form>
      </div>

      <!-- INFOS CABINET -->
      <div class="space-y-4">
        <h3 class="font-semibold text-[#bfa14a] text-xl">Our Office</h3>
        <p class="text-gray-700">
          📍 Carrefour Auberge, above Benin Pharmacy, Bafoussam, Cameroon
        </p>
        <p class="text-gray-700">📞 +237 6 99 78 35 64</p>
        <p class="text-gray-700">✉️ contact@cabinet-tsapy.com</p>

        <iframe
          src="https://maps.google.com/maps?q=carrefour+auberge%2C+bafoussam%2C+cameroun&t=&z=13&ie=UTF8&iwloc=&output=embed"
          class="w-full h-60 rounded-lg border border-[#bfa14a] mt-4">
        </iframe>
      </div>
    </div>
  </div>
</section>
