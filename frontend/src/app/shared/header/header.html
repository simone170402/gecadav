<header
  class="site-header"
  [ngClass]="{
    'header-home': isHomePage() && !isScrolled,
    'header-solid': !isHomePage() || isScrolled
  }"
>
  <div class="header-shell">
    <!-- LEFT -->
    <div class="header-left">
      <a routerLink="/" class="brand-block">
        <img
          [src]="isHomePage() && !isScrolled
            ? '/images/Law_Logo-removebg-preview.png'
            : '/images/Law_Logo-removebg-preview.png'"
          alt="Tsapy & Partners Logo"
          class="brand-logo"
          [ngClass]="{
            'logo-large': !isScrolled,
            'logo-small': isScrolled
          }"
        />

        <div class="brand-text-wrap">
          <span
            class="brand-name"
            [ngClass]="{
              'brand-home': isHomePage() && !isScrolled,
              'brand-solid': !isHomePage() || isScrolled
            }"
          >
            Tsapy & Partners
          </span>
        </div>
      </a>
    </div>

    <!-- RIGHT -->
    <div class="header-right">
      <nav class="desktop-nav">
        <a
          routerLink="/"
          routerLinkActive="nav-active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
        >
          Home
        </a>

        <a routerLink="/apropos" routerLinkActive="nav-active" class="nav-link">
          About Us
        </a>

        <a routerLink="/vision" routerLinkActive="nav-active" class="nav-link">
          Vision & Mission
        </a>

        <a routerLink="/cabinet" routerLinkActive="nav-active" class="nav-link">
          Our Firm
        </a>

        <a routerLink="/avocats" routerLinkActive="nav-active" class="nav-link">
          Our Team
        </a>

        <a routerLink="/domaines" routerLinkActive="nav-active" class="nav-link">
          Services
        </a>

        <a routerLink="/contact" routerLinkActive="nav-active" class="nav-link">
          Contact
        </a>
        <a routerLink="/blog" routerLinkActive="nav-active" class="nav-link">
          Blog
        </a>
        <a routerLink="/revue" routerLinkActive="nav-active" class="nav-link">
          Revue
        </a>
      </nav>

      <div class="header-actions">
        <button aria-label="Search" class="search-btn">
          <svg xmlns="http://www.w3.org/2000/svg"
               class="search-icon"
               fill="none"
               viewBox="0 0 24 24"
               stroke="currentColor">
            <path stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1010.5 18a7.5 7.5 0 006.15-3.35z" />
          </svg>
        </button>

        <div class="lang-switch">
          <a href="#" onclick="doGTranslate('en|en')" title="English" aria-label="English">
            <span class="flag flag-en"></span>
          </a>

          <a href="#" onclick="doGTranslate('en|fr')" title="Français" aria-label="Français">
            <span class="flag flag-fr"></span>
          </a>
        </div>

        <a routerLink="/admin/login" class="btn-header btn-signin">
          Sign In
        </a>

        <a routerLink="/admin/dashboard" class="btn-header btn-pro">
          Espace Pro
        </a>
      </div>

      <!-- MOBILE TOGGLE -->
      <button
        class="mobile-toggle"
        (click)="toggleMenu()"
        aria-label="Open menu"
        [attr.aria-expanded]="isMenuOpen"
      >
        <svg *ngIf="!isMenuOpen" xmlns="http://www.w3.org/2000/svg" class="mobile-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 12h16m-7 6h7" />
        </svg>

        <svg *ngIf="isMenuOpen" xmlns="http://www.w3.org/2000/svg" class="mobile-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <!-- MOBILE MENU -->
  <div class="mobile-menu" [class.mobile-menu-open]="isMenuOpen">
    <div class="mobile-menu-inner">
      <a routerLink="/" (click)="toggleMenu()" class="mobile-link">Home</a>
      <a routerLink="/apropos" (click)="toggleMenu()" class="mobile-link">About Us</a>
      <a routerLink="/vision" (click)="toggleMenu()" class="mobile-link">Vision & Mission</a>
      <a routerLink="/cabinet" (click)="toggleMenu()" class="mobile-link">Our Firm</a>
      <a routerLink="/avocats" (click)="toggleMenu()" class="mobile-link">Our Team</a>
      <a routerLink="/domaines" (click)="toggleMenu()" class="mobile-link">Services</a>
      <a routerLink="/contact" (click)="toggleMenu()" class="mobile-link">Contact</a>
      <a routerLink="/blog" (click)="toggleMenu()" class="mobile-link">Blog</a>
      <a routerLink="/revue" (click)="toggleMenu()" class="mobile-link">Revue</a>

      <div class="mobile-actions">
        <a routerLink="/admin/dashboard" (click)="toggleMenu()" class="mobile-btn mobile-btn-pro">
          Espace Pro
        </a>
      </div>

      <div class="mobile-lang">
        <a href="#" onclick="doGTranslate('en|en')" title="English" aria-label="English">
          <span class="flag flag-en"></span>
        </a>

        <a href="#" onclick="doGTranslate('en|fr')" title="Français" aria-label="Français">
          <span class="flag flag-fr"></span>
        </a>
      </div>
    </div>
  </div>
</header>
